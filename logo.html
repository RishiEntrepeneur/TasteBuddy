<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TasteBuddy Premium Logo Canvas</title>
    <style>
        body { margin: 0; background-color: #0B0F19; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
        .canvas { width: 650px; height: 220px; background: #0F172A; border-radius: 20px; display: flex; align-items: center; padding: 0 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid #1E293B; }
        .logo-mark { position: relative; width: 110px; height: 110px; margin-right: 30px; }
        .bracket { position: absolute; width: 25px; height: 25px; border: 4px solid #F97316; }
        .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
        .tr { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 8px; }
        .bl { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 8px; }
        .br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 8px; }
        .fork-icon { position: absolute; top: 22px; left: 34px; width: 42px; height: 65px; display: flex; flex-direction: column; align-items: center; }
        .tines { display: flex; justify-content: space-between; width: 100%; height: 28px; }
        .tine { width: 5px; height: 100%; background: #E2E8F0; border-radius: 3px; }
        .tine-bridge { width: 100%; height: 5px; background: #E2E8F0; margin-top: -5px; border-radius: 2px; }
        .stem { width: 5px; height: 35px; background: #E2E8F0; border-radius: 3px; margin-top: 2px; }
        .node { position: absolute; bottom: 12px; left: 52.5px; width: 11px; height: 11px; background: #38BDF8; border-radius: 50%; box-shadow: 0 0 12px #38BDF8; }
        .text-area { display: flex; flex-direction: column; }
        .title { font-size: 64px; font-weight: 800; color: #FFFFFF; letter-spacing: -2px; line-height: 1; margin: 0; }
        .title span { color: #F97316; font-weight: 300; letter-spacing: -1px; }
        .subtitle { font-size: 13px; font-weight: 600; color: #64748B; letter-spacing: 7px; margin-top: 8px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="logo-mark">
            <div class="bracket tl"></div>
            <div class="bracket tr"></div>
            <div class="bracket bl"></div>
            <div class="bracket br"></div>
            <div class="fork-icon">
                <div class="tines">
                    <div class="tine"></div>
                    <div class="tine"></div>
                    <div class="tine"></div>
                    <div class="tine"></div>
                </div>
                <div class="tine-bridge"></div>
                <div class="stem"></div>
            </div>
            <div class="node"></div>
        </div>
        <div class="text-area">
            <h1 class="title">Taste<span>Buddy</span></h1>
            <div class="subtitle">Live Engine Core</div>
        </div>
    </div>

</body>
</html>
