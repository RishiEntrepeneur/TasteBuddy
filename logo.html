<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TasteBuddy Unique Identity</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #F8FAFC; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .canvas { width: 640px; height: 180px; background: #FFFFFF; border-radius: 28px; display: flex; align-items: center; padding: 0 40px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06); border: 1px solid #E2E8F0; }
        
        /* The Flavor Drop Container */
        .logo-mark { position: relative; width: 120px; height: 120px; margin-right: 25px; display: flex; justify-content: center; align-items: center; }
        
        .drop { position: absolute; width: 60px; height: 90px; border-radius: 60px 60px 0 60px; transform: rotate(-45deg); }
        /* Pink/Orange Flavor Drop */
        .d1 { background: linear-gradient(135deg, #FF2E93, #FF8A00); transform: rotate(-15deg); left: 15px; }
        /* Green/Blue Freshness Drop */
        .d2 { background: linear-gradient(135deg, #00DF89, #00B4D8); transform: rotate(45deg); right: 15px; mix-blend-mode: multiply; opacity: 0.9; }
        
        .text-area { display: flex; flex-direction: column; }
        .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 58px; font-weight: 800; color: #0F172A; letter-spacing: -2px; line-height: 1; margin: 0; }
        .title span { color: #475569; font-weight: 300; letter-spacing: -1px; padding-left: 4px; }
        .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 800; color: #94A3B8; letter-spacing: 5px; margin-top: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="logo-mark">
            <div class="drop d1"></div>
            <div class="drop d2"></div>
        </div>
        <div class="text-area">
            <h1 class="title">Taste<span>Buddy</span></h1>
            <div class="subtitle">The AR Dining App</div>
        </div>
    </div>

</body>
</html>
