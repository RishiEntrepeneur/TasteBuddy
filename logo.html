<svg xmlns="http://w3.org" viewBox="0 0 750 200" width="100%" height="100%">
  <!-- Bright Clean White Background -->
  <rect width="750" height="200" fill="#FFFFFF"/>

  <!-- Simple Multi-Color Overlapping Flavor Drops -->
  <g transform="translate(60, 40)">
    <defs>
      <linearGradient id="pinkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF2E93" />
        <stop offset="100%" stop-color="#FF8A00" />
      </linearGradient>
      <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00DF89" />
        <stop offset="100%" stop-color="#00B4D8" />
      </linearGradient>
    </defs>

    <!-- Drop 1: Flavor / Appetite (Pink-Orange) -->
    <path d="M 60 20 C 90 20, 110 50, 60 110 C 10 50, 30 20, 60 20 Z" fill="url(#pinkGrad)" transform="rotate(-30 60 65)" />
    
    <!-- Drop 2: Freshness / Ingredients (Green-Blue) -->
    <path d="M 60 20 C 90 20, 110 50, 60 110 C 10 50, 30 20, 60 20 Z" fill="url(#greenGrad)" transform="rotate(30 60 65)" opacity="0.85" />
    
    <!-- The overlapping intersection creates a bright neon leaf directly in the center -->
  </g>

  <!-- Typography: Modern, Premium Rounded Sans-Serif -->
  <g transform="translate(225, 122)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="#0F172A" letter-spacing="-2">Taste</text>
    <text x="165" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="300" fill="#475569" letter-spacing="-1">Buddy</text>
    
    <!-- Subtitle -->
    <text y="36" x="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="6">THE AR DINING APP</text>
  </g>
</svg>
