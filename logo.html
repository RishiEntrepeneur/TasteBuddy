<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TasteBuddy Premium Identity</title>
    <!-- Importing a gorgeous, high-end editorial serif font from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #07090E; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .canvas { width: 720px; height: 220px; background: #0A0D14; border-radius: 24px; display: flex; align-items: center; padding: 0 50px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); border: 1px solid #131A26; }
        .logo-mark { position: relative; width: 120px; height: 120px; margin-right: 40px; display: flex; justify-content: center; align-items: center; }
        .outer-ring { position: absolute; width: 100%; height: 100%; border: 1.5px solid rgba(148, 163, 184, 0.15); border-radius: 50%; }
        .aperture { position: absolute; width: 85%; height: 85%; border: 2px dashed #EAB308; border-radius: 50%; opacity: 0.8; animation: slowRotate 40s linear infinite; }
        .lens-core { position: absolute; width: 30px; height: 75px; background: rgba(234, 179, 8, 0.08); border: 1.5px solid #EAB308; border-radius: 50%; }
        .lens-cross { position: absolute; width: 75px; height: 30px; background: rgba(234, 179, 8, 0.03); border: 1px solid rgba(234, 179, 8, 0.4); border-radius: 50%; }
        .center-dot { position: absolute; width: 5px; height: 5px; background: #FFFFFF; border-radius: 50%; box-shadow: 0 0 8px #FFFFFF; }
        .text-area { display: flex; flex-direction: column; }
        .title { font-family: 'Playfair Display', 'Times New Roman', serif; font-size: 68px; font-weight: 400; color: #FFFFFF; letter-spacing: -1px; line-height: 1; margin: 0; }
        .title span { color: #EAB308; font-style: italic; font-weight: 400; letter-spacing: 1px; padding-left: 8px; }
        .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 500; color: #475569; letter-spacing: 9px; margin-top: 14px; text-transform: uppercase; }
        @keyframes slowRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="logo-mark">
            <div class="outer-ring"></div>
            <div class="aperture"></div>
            <div class="lens-cross"></div>
            <div class="lens-core"></div>
            <div class="center-dot"></div>
        </div>
        <div class="text-area">
            <h1 class="title">Taste<span>Buddy</span></h1>
            <div class="subtitle">Intelligent Dining Platform</div>
        </div>
    </div>

</body>
</html>
