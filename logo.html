<svg xmlns="http://w3.org" viewBox="0 0 750 200" width="100%" height="100%">
  <!-- Clean, Bright White Canvas Background -->
  <rect width="750" height="200" fill="#FFFFFF"/>

  <!-- Simple Multi-Color Overlapping Gradient Icon -->
  <g transform="translate(60, 45)">
    <defs>
      <!-- Vibrant Pink/Magenta to Orange Gradient -->
      <linearGradient id="tasteGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#EC4899" />
        <stop offset="100%" stop-color="#F97316" />
      </linearGradient>
      <!-- Bright Sky Blue to Teal Gradient -->
      <linearGradient id="buddyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8" />
        <stop offset="100%" stop-color="#06B6D4" />
      </linearGradient>
    </defs>

    <!-- First Circle (Taste: Representing Appetite/Warmth) -->
    <circle cx="45" cy="55" r="45" fill="url(#tasteGrad)" />
    
    <!-- Overlapping Second Circle (Buddy: Representing Connectivity/Tech) -->
    <!-- mix-blend-mode overlay style blend effect natively using opacity -->
    <circle cx="85" cy="55" r="45" fill="url(#buddyGrad)" opacity="0.85" />
    
    <!-- Central Overlap Highlight Core -->
    <path d="M 65 24 A 45 45 0 0 1 85 55 A 45 45 0 0 1 65 86 A 45 45 0 0 1 45 55 A 45 45 0 0 1 65 24 Z" fill="#A855F7" opacity="0.4"/>
  </g>

  <!-- Typography: Bold, Friendly, Ultra-Modern Sans-Serif -->
  <g transform="translate(225, 122)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#0F172A" letter-spacing="-3">Taste</text>
    <text x="165" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="400" fill="#64748B" letter-spacing="-1">Buddy</text>
    
    <!-- Subtitle Platform Identifier -->
    <text y="36" x="4" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="6">THE AR DINING APP</text>
  </g>
</svg>
